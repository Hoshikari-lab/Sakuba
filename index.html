<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAKUBA - Hoshikari Editorial</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Encabezado Superior Blanco -->
    <div class="header-top">
        <div style="display: flex; align-items: baseline;">
            <a href="#" class="logo-sakuba" onclick="mostrarInicio()">SAKUBA</a>
            <span class="logo-sub">SAKUBA es un sitio de publicación y lectura de novelas ligeras en español.</span>
        </div>
        <div class="header-links">
            <a href="#">Centro de ayuda</a>
            <a href="#">Acceso</a>
        </div>
    </div>

    <!-- Barra de Navegación Azul Marino -->
    <div class="navbar-azul">
        <div class="nav-links">
            <button onclick="mostrarInicio()">Marcador</button>
            <button onclick="mostrarInicio()">Historial de navegación</button>
            <button onclick="mostrarInicio()">Categorías</button>
        </div>
        <div class="search-box">
            <input type="text" id="input-buscar" placeholder="Buscar obras...">
            <button onclick="buscarObra()">Buscar</button>
        </div>
    </div>

    <!-- Barra Lateral/Superior de Categorías -->
    <div class="barra-categories" id="contenedor-categorias">
        <button class="btn-cat activo" onclick="filtrarCategoria('Todos')">En general</button>
        <button class="btn-cat" onclick="filtrarCategoria('Isekai')">Isekai</button>
        <button class="btn-cat" onclick="filtrarCategoria('Fantasía')">Fantasía</button>
        <button class="btn-cat" onclick="filtrarCategoria('Romance')">Romance</button>
        <button class="btn-cat" onclick="filtrarCategoria('Ciencia ficción')">Ciencia ficción</button>
        <button class="btn-cat" onclick="filtrarCategoria('Recuentos de la vida')">Recuentos de la vida</button>
        <button class="btn-cat" onclick="filtrarCategoria('Acción')">Acción</button>
        <button class="btn-cat" onclick="filtrarCategoria('Comedia')">Comedia</button>
    </div>

    <!-- Contenedor Dinámico Principal -->
    <div class="contenedor-principal">
        
        <!-- VISTA 1: Lista de Obras (Página de Inicio) -->
        <div id="vista-lista-obras">
            <div class="titulo-seccion">Obras con mejor clasificación de la editorial</div>
            <div id="lista-obras-target"></div>
            
            <!-- Paginación Inferior Ficticia de tus Capturas -->
            <div class="paginacion">
                <button class="btn-pag" disabled>&larr; Anterior</button>
                <button class="btn-pag" style="background:#005691; color:#fff; border-color:#005691;">Página 1</button>
                <button class="btn-pag" disabled>Siguiente &rarr;</button>
            </div>
        </div>

        <!-- VISTA 2: Ficha Técnica de la Novela / Índice de Capítulos -->
        <div id="vista-ficha-obra" class="oculto">
            <button class="btn-cat" onclick="mostrarInicio()" style="margin-bottom:15px;">&larr; Volver al inicio</button>
            <div class="ficha-detalles">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h1 class="ficha-titulo" id="ficha-titulo-obra"></h1>
                    <span id="ficha-badge-status"></span>
                </div>
                <div id="ficha-autor-obra" style="font-size:14px; color:#666; margin-bottom:10px;"></div>
                <div id="ficha-generos-obra" style="margin-bottom:15px;"></div>
                
                <div class="titulo-seccion" style="font-size:15px; margin-top:20px;">Sinopsis</div>
                <div class="caja-sinopsis" id="ficha-sinopsis-obra"></div>

                <div class="titulo-seccion" style="font-size:15px; margin-top:25px;">Índice de Capítulos</div>
                <div id="ficha-lista-capitulos"></div>
            </div>
        </div>

        <!-- VISTA 3: Pantalla de Lectura del Capítulo -->
        <div id="vista-lectura-capitulo" class="oculto">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <button class="btn-cat" id="btn-regresar-ficha">&larr; Ficha de la obra</button>
                <div style="display:flex; align-items:center;">
                    <button class="btn-fuente" onclick="cambiarFuente(-2)">A-</button>
                    <button class="btn-fuente" onclick="cambiarFuente(2)">A+</button>
                </div>
            </div>

            <div class="pantalla-texto">
                <h1 id="lectura-titulo-cap" style="text-align:center; color:#333; font-size:22px; margin-bottom:30px;"></h1>
                <hr style="border:0; border-top:1px solid #e0e0e0; margin-bottom:30px;">
                <div id="lectura-contenido-texto"></div>
            </div>

            <!-- Navegación entre capítulos al final de la lectura -->
            <div style="display:flex; justify-content:space-between; margin-top:25px;">
                <button class="btn-nav-cap" id="btn-cap-anterior">&larr; Capítulo Anterior</button>
                <button class="btn-nav-cap" id="btn-cap-siguiente">Capítulo Siguiente &rarr;</button>
            </div>
        </div>

    </div>

    <!-- Conexión con los archivos de control lógico -->
    <script src="app.js"></script>
</body>
</html>
