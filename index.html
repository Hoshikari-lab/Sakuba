<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAKUBA - Hoshikari Editorial</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 0; }
        .header-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 40px; background: #fff; border-bottom: 1px solid #e0e0e0; }
        .logo-sakuba { font-size: 26px; font-weight: bold; color: #005691; text-decoration: none; }
        .logo-sub { font-size: 13px; color: #666; margin-left: 15px; }
        .header-links a { color: #005691; text-decoration: none; margin-left: 20px; font-size: 14px; }
        .navbar-azul { background-color: #005691; display: flex; align-items: center; justify-content: space-between; padding: 10px 40px; }
        .nav-links button { background: none; border: none; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; padding: 8px 12px; border-radius: 4px; }
        .nav-links button:hover { background: rgba(255,255,255,0.1); }
                .search-box { display: flex; gap: 5px; }
        .search-box input { padding: 6px 12px; border: 1px solid #ccc; border-radius: 4px; width: 220px; }
        .search-box button { background: #fff; border: 1px solid #ccc; color: #333; padding: 6px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .barra-categories { background: #fff; padding: 10px 40px; border-bottom: 1px solid #e0e0e0; display: flex; gap: 8px; overflow-x: auto; }
        .btn-cat { background: #fff; border: 1px solid #ccc; padding: 5px 12px; border-radius: 4px; font-size: 13px; color: #55; cursor: pointer; white-space: nowrap; }
        .btn-cat.activo { background: #005691; color: #fff; border-color: #005691; }
        .contenedor-principal { max-width: 1000px; margin: 25px auto; padding: 0 20px; }
        .titulo-seccion { font-size: 16px; font-weight: bold; color: #333; border-bottom: 2px solid #005691; padding-bottom: 6px; margin-bottom: 20px; }
                .tarjeta-obra { background: #fff; border: 1px solid #e0e0e0; padding: 20px; margin-bottom: 15px; border-radius: 4px; }
        .obra-titulo { font-size: 17px; font-weight: bold; color: #005691; text-decoration: none; cursor: pointer; }
        .badge-status { display: inline-block; font-size: 11px; font-weight: bold; color: #fff; padding: 3px 6px; border-radius: 3px; margin-left: 10px; vertical-align: middle; }
        .status-emision { background-color: #28a745; }
        .status-finalizado { background-color: #b82c3c; }
        .obra-sinopsis { font-size: 14px; color: #555; line-height: 1.6; margin: 10px 0; text-align: justify; }
        .obra-meta { font-size: 12px; color: #888; margin-top: 5px; }
        .estrellas-ranking { color: #ffb703; font-weight: bold; font-size: 14px; margin-left: 10px; }
        .ficha-detalles { background: #fff; border: 1px solid #e0e0e0; padding: 25px; border-radius: 4px; }
        .ficha-titulo { font-size: 22px; font-weight: bold; color: #333; margin: 0 0 10px 0; }
        .caja-sinopsis { background: #fafafa; border: 1px solid #eee; padding: 15px; border-radius: 4px; margin: 15px 0; font-size: 14px; line-height: 1.6; color: #555; }
        .link-capitulo { display: block; background: #fff; border: 1px solid #e0e0e0; padding: 12px 15px; margin-bottom: 8px; border-radius: 4px; color: #005691; text-decoration: none; font-size: 14px; cursor: pointer; }
        .link-capitulo:hover { background: #f1f5f9; }
        .btn-fuente { background: #fff; border: 1px solid #ccc; padding: 5px 10px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .pantalla-texto { background: #fff; border: 1px solid #e0e0e0; padding: 35px; border-radius: 4px; line-height: 1.8; color: #222; text-align: justify; font-size: 18px; }
        .pantalla-texto p { margin-bottom: 18px; }
        .btn-nav-cap { background: #fff; border: 1px solid #005691; color: #005691; padding: 8px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-nav-cap:disabled { border-color: #ccc; color: #ccc; cursor: not-allowed; }
        .paginacion { display: flex; justify-content: center; gap: 8px; margin: 20px 0; }
        .btn-pag { background: #fff; border: 1px solid #ccc; padding: 6px 12px; border-radius: 4px; color: #55; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header-top">
        <div style="display: flex; align-items: baseline;">
            <a href="#" class="logo-sakuba" onclick="mostrarInicio()">SAKUBA</a>
            <span class="logo-sub">SAKUBA es un sitio de publicación y lectura de novelas ligeras en español.</span>
        </div>
        <div class="header-links"><a href="#">Centro de ayuda</a><a href="#">Acceso</a></div>
    </div>
        <div class="navbar-azul">
        <div class="nav-links">
            <button onclick="mostrarInicio()">Marcador</button>
            <button onclick="mostrarInicio()">Historial de navegación</button>
            <button onclick="mostrarInicio()">Categorías</button>
        </div>
        <div class="search-box">
            <input type="text" id="input-buscar" placeholder="Buscar obras...">
            <button onclick="buscarObra()">Buscar</button>
        </div>
    </div>

    <div class="barra-categories">
        <button class="btn-cat activo" onclick="filtrarCategoria('Todos')">En general</button>
        <button class="btn-cat" onclick="filtrarCategoria('Isekai')">Isekai</button>
        <button class="btn-cat" onclick="filtrarCategoria('Fantasía')">Fantasía</button>
        <button class="btn-cat" onclick="filtrarCategoria('Romance')">Romance</button>
        <button class="btn-cat" onclick="filtrarCategoria('Ciencia ficción')">Ciencia ficción</button>
        <button class="btn-cat" onclick="filtrarCategoria('Recuentos de la vida')">Recuentos de la vida</button>
        <button class="btn-cat" onclick="filtrarCategoria('Acción')">Acción</button>
        <button class="btn-cat" onclick="filtrarCategoria('Comedia')">Comedia</button>
    </div>

    <div class="contenedor-principal">
        
        <!-- PANTALLA 1: CATALOGO / TOP RANKING -->
        <div id="vista-lista-obras">
            <div class="titulo-seccion" id="texto-titulo-principal">Obras con mejor clasificación de la editorial</div>
            <div id="lista-obras-target"></div>
            <div class="paginacion">
                <button class="btn-pag" disabled>&larr; Anterior</button>
                <button class="btn-pag" style="background:#005691; color:#fff;">Página 1</button>
                <button class="btn-pag" disabled>Siguiente &rarr;</button>
            </div>
        </div>
                <!-- PANTALLA 2: FICHA DE LA OBRA -->
        <div id="vista-ficha-obra" style="display: none;">
            <button class="btn-cat" onclick="mostrarInicio()" style="margin-bottom:15px;">&larr; Volver al inicio</button>
            <div class="ficha-detalles">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h1 class="ficha-titulo" id="ficha-titulo-obra"></h1>
                    <span id="ficha-badge-status" class="badge-status"></span>
                </div>
                <div id="ficha-autor-obra" style="font-size:14px; color:#666; margin-bottom:5px;"></div>
                <div id="ficha-ranking-obra" style="margin-bottom:10px;"></div>
                <div id="ficha-generos-obra" style="margin-bottom:15px;"></div>
                
                <!-- Botón de Historial de Lectura LocalStorage -->
                <div id="caja-marcador-continuar" style="margin-bottom: 20px;"></div>

                <div class="titulo-seccion" style="font-size:15px;">Sinopsis</div>
                <div class="caja-sinopsis" id="ficha-sinopsis-obra"></div>
                <div class="titulo-seccion" style="font-size:15px; margin-top:25px;">Índice de Capítulos</div>
                <div id="ficha-lista-capitulos" style="display:flex; flex-direction:column; gap:5px;"></div>
            </div>
        </div>
                <!-- PANTALLA 3: LECTURA -->
        <div id="vista-lectura-capitulo" style="display: none;">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <button class="btn-cat" id="btn-regresar-ficha">&larr; Ficha de la obra</button>
                <div>
                    <button class="btn-fuente" onclick="cambiarFuente(-2)">A-</button>
                    <button class="btn-fuente" onclick="cambiarFuente(2)">A+</button>
                </div>
            </div>
            <div class="pantalla-texto">
                <h1 id="lectura-titulo-cap" style="text-align:center; color:#333; font-size:22px;"></h1>
                <hr style="border:0; border-top:1px solid #e0e0e0; margin-bottom:30px;">
                <div id="lectura-contenido-texto"></div>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:25px;">
                <button class="btn-nav-cap" id="btn-cap-anterior">&larr; Capítulo Anterior</button>
                <button class="btn-nav-cap" id="btn-cap-siguiente">Capítulo Siguiente &rarr;</button>
            </div>
        </div>

    </div>

    <script>
        const CATALOGO_NOVELAS = [
                    {
                id: "el-camino-del-heroe-isekai",
                titulo: "El Camino del Héroe Isekai",
                autor: "Nombre_Autor_1",
                status: "EN EMISIÓN",
                estrellas: 5,
                generos: ["Isekai", "Fantasía", "Acción"],
                sinopsis: "Un joven común es transportado inesperadamente a un místico mundo de fantasía medieval. Allí descubrirá que posee una afinidad sin precedentes con la magia elemental de los antiguos, viéndose obligado a aprender rápidamente a dominar sus nuevos poderes para sobrevivir en un entorno hostil y encontrar un camino de regreso a su hogar natal.",
                capitulos: [
                    { numero: 1, titulo: "Capítulo 1: El despertar en el nuevo mundo", contenido: "Esta es la primera línea del capítulo uno que la editorial Hoshikari ha guardado de forma directa. El protagonista abre los ojos en una pradera desconocida bajo un cielo de dos lunas.\n\nSe levanta con el corazón acelerado, dándose cuenta de que ya no se encuentra en su ciudad natal, sino en las místicas tierras de un mundo de fantasía medieval." },
                    { numero: 2, titulo: "Capítulo 2: El primer encuentro con la magia", contenido: "Extender la mano hacia adelante requería una fuerza de voluntad descomunal. El aire a su alrededor comenzó a vibrar con una intensidad electrizante, manifestando pequeñas esferas de luz azulina que orbitaban suavemente alrededor de sus dedos.\n\nSintió un torrente cálido recorrer sus venas, una energía antigua y pura que respondía directamente a sus pensamientos más profundos. Los textos sagrados de este mundo lo llamaban 'Mana', pero para él, era la única herramienta que le garantizaría la supervivencia en este vasto e explorado continente." }
                ]
            },
                        {
                id: "cronicas-de-un-cuento-corto",
                titulo: "Crónicas de un Cuento Corto",
                autor: "Nombre_Autor_2",
                status: "FINALIZADO",
                estrellas: 1,
                generos: ["Recuentos de la vida", "Drama"],
                sinopsis: "Una historia breve y conmovedora sobre la melancolía del invierno y los recuerdos perdidos en una pequeña y acogedora cafetería en el corazón de la gran ciudad.",
                capitulos: [
                    { numero: 1, titulo: "Capítulo 1: La cafetería del invierno", contenido: "El aroma a café recién molido inundaba el rincón más apartado de la pequeña estancia mientras la nieve golpeaba con suavidad el cristal de la ventana.\n\nPara el autor, cada taza servida guardaba un fragmento del pasado de la gran urbe." }
                ]
            }
        ];

        let novelaActiva = null;
        let tamanoFuente = 18;
        let categoriaFiltrada = "Todos";
                function renderizarListaObras() {
            const target = document.getElementById('lista-obras-target');
            if (!target) return;
            target.innerHTML = "";
            
            const tituloPrincipal = document.getElementById('texto-titulo-principal');
            if (categoriaFiltrada === "Todos") {
                tituloPrincipal.innerText = "Obras con mejor clasificación de la editorial";
            } else {
                tituloPrincipal.innerText = `Obras de la categoría: ${categoriaFiltrada}`;
            }

            const obrasClonadas = [...CATALOGO_NOVELAS];
            obrasClonadas.sort((a, b) => b.estrellas - a.estrellas);

            const obrasFiltradas = obrasClonadas.filter(o => 
                categoriaFiltrada === "Todos" || o.generos.includes(categoriaFiltrada)
            );

            obrasFiltradas.forEach((obra, index) => {
                if (categoriaFiltrada === "Todos" && obra.estrellas < 2 && index >= 10) return;

                const statusClass = obra.status === "EN EMISIÓN" ? "status-emision" : "status-finalizado";
                let estrellasHtml = "";
                for(let i = 1; i <= 5; i++) {
                    estrellasHtml += i <= obra.estrellas ? "&#9733;" : "&#9734;";
                }

                const div = document.createElement('div');
                div.className = "tarjeta-obra";
                div.innerHTML = `
                    <div>
                        <span class="obra-titulo" onclick="verFichaObra('${obra.id}')">${obra.titulo}</span>
                        <span class="badge-status ${statusClass}">${obra.status}</span>
                        <span class="estrellas-ranking">${estrellasHtml}</span>
                    </div>
                    <p class="obra-sinopsis">${obra.sinopsis}</p>
                    <div class="obra-meta">Autor: ${obra.autor} - Capítulos: ${obra.capitulos.length}</div>
                `;
                target.appendChild(div);
            });
        }
                function verFichaObra(id) {
            novelaActiva = CATALOGO_NOVELAS.find(o => o.id === id);
            if (!novelaActiva) return;

            document.getElementById('ficha-titulo-obra').innerText = novelaActiva.titulo;
            document.getElementById('ficha-autor-obra').innerText = `Autor: ${novelaActiva.autor}`;
            document.getElementById('ficha-sinopsis-obra').innerText = novelaActiva.sinopsis;
            
            const badge = document.getElementById('ficha-badge-status');
            badge.innerText = novelaActiva.status;
            badge.className = "badge-status " + (novelaActiva.status === "EN EMISIÓN" ? "status-emision" : "status-finalizado");

            let estrellasHtml = "";
            for(let i = 1; i <= 5; i++) {
                estrellasHtml += i <= novelaActiva.estrellas ? "&#9733;" : "&#9734;";
            }
            document.getElementById('ficha-ranking-obra').innerHTML = `<span class="estrellas-ranking" style="margin:0;">${estrellasHtml}</span>`;

            const contenedorGens = document.getElementById('ficha-generos-obra');
            contenedorGens.innerHTML = "";
            novelaActiva.generos.forEach(g => {
                contenedorGens.innerHTML += `<span class="btn-cat" style="margin-right:5px; cursor:default;">${g}</span>`;
            });

            verificarMarcadorLocal();

            const contenedorCaps = document.getElementById('ficha-lista-capitulos');
            contenedorCaps.innerHTML = "";
            novelaActiva.capitulos.forEach((cap, idx) => {
                const a = document.createElement('a');
                a.className = "link-capitulo";
                a.innerText = cap.titulo;
                a.onclick = () => cargarLecturaCapitulo(idx);
                contenedorCaps.appendChild(a);
            });

            cambiarVista('vista-ficha-obra');
        }
                function verificarMarcadorLocal() {
            const contenedorMarcador = document.getElementById('caja-marcador-continuar');
            contenedorMarcador.innerHTML = "";
            
            const ultimoCapIdx = localStorage.getItem(`sakuba_progreso_${novelaActiva.id}`);
            
            if (ultimoCapIdx !== null) {
                const idx = parseInt(ultimoCapIdx);
                if (idx >= 0 && idx < novelaActiva.capitulos.length) {
                    const cap = novelaActiva.capitulos[idx];
                    const btn = document.createElement('button');
                    btn.className = "link-capitulo link-historial";
                    btn.style.width = "100%";
                    btn.style.textAlign = "left";
                    btn.innerHTML = `<strong>&#128214; Continuar leyendo:</strong> ${cap.titulo}`;
                    btn.onclick = () => cargarLecturaCapitulo(idx);
                    contenedorMarcador.appendChild(btn);
                }
            }
        }
                function cargarLecturaCapitulo(index) {
            if (!novelaActiva || index < 0 || index >= novelaActiva.capitulos.length) return;
            
            localStorage.setItem(`sakuba_progreso_${novelaActiva.id}`, index);
            
            const cap = novelaActiva.capitulos[index];
            document.getElementById('lectura-titulo-cap').innerText = cap.titulo;
            const contenedorTexto = document.getElementById('lectura-contenido-texto');
            contenedorTexto.innerHTML = "";

            const parrafos = cap.contenido.split(/\n\s*\n/);
            parrafos.forEach(pTxt => {
                if(pTxt.trim() !== "") {
                    const p = document.createElement('p');
                    p.innerHTML = pTxt.replace(/\n/g, '<br>');
                    contenedorTexto.appendChild(p);
                }
            });

            document.getElementById('btn-cap-anterior').disabled = (index === 0);
            document.getElementById('btn-cap-siguiente').disabled = (index === novelaActiva.capitulos.length - 1);
            
            document.getElementById('btn-cap-anterior').onclick = () => cargarLecturaCapitulo(index - 1);
            document.getElementById('btn-cap-siguiente').onclick = () => cargarLecturaCapitulo(index + 1);
            document.getElementById('btn-regresar-ficha').onclick = () => verFichaObra(novelaActiva.id);

            cambiarVista('vista-lectura-capitulo');
        }
                function cambiarVista(idVista) {
            document.getElementById('vista-lista-obras').style.display = 'none';
            document.getElementById('vista-ficha-obra').style.display = 'none';
            document.getElementById('vista-lectura-capitulo').style.display = 'none';
            
            document.getElementById(idVista).style.display = 'block';
            window.scrollTo(0,0);
        }

        function filtrarCategoria(categoria) {
            categoriaFiltrada = categoria;
            document.querySelectorAll('.btn-cat').forEach(b => {
                if(b.innerText === categoria || (categoria === 'Todos' && b.innerText === 'En general')) {
                    b.classList.add('activo');
                } else {
                    b.classList.remove('activo');
                }
            });
            mostrarInicio();
            renderizarListaObras();
        }
                function buscarObra() {
            const query = document.getElementById('input-buscar').value.toLowerCase().trim();
            if (!query) { renderizarListaObras(); return; }
            const target = document.getElementById('lista-obras-target');
            if (!target) return;
            target.innerHTML = "";
            
            document.getElementById('texto-titulo-principal').innerText = `Resultados de búsqueda: "${query}"`;
            
            const filtradas = CATALOGO_NOVELAS.filter(o => 
                o.titulo.toLowerCase().includes(query) || o.autor.toLowerCase().includes(query)
            );

            if(filtradas.length === 0) {
                target.innerHTML = "<p style='color:#666; padding:20px;'>No se encontraron obras coincidentes.</p>";
                return;
            }

            filtradas.forEach(obra => {
                const statusClass = obra.status === "EN EMISIÓN" ? "status-emision" : "status-finalizado";
                let estrellasHtml = "";
                for(let i = 1; i <= 5; i++) {
                    estrellasHtml += i <= obra.estrellas ? "&#9733;" : "&#9734;";
                }

                const div = document.createElement('div');
                div.className = "tarjeta-obra";
                div.innerHTML = `
                    <div>
                        <span class="obra-titulo" onclick="verFichaObra('${obra.id}')">${obra.titulo}</span>
                        <span class="badge-status ${statusClass}">${obra.status}</span>
                        <span class="estrellas-ranking">${estrellasHtml}</span>
                    </div>
                    <p class="obra-sinopsis">${obra.sinopsis}</p>
                `;
                target.appendChild(div);
            });
            mostrarInicio();
        }
                function cambiarFuente(delta) {
            tamanoFuente += delta;
            document.getElementById('lectura-contenido-texto').style.fontSize = Math.max(14, Math.min(28, tamanoFuente)) + "px";
        }

        function mostrarInicio() { 
            window.history.pushState({}, "", window.location.pathname);
            cambiarVista('vista-lista-obras'); 
        }
                function actualizarURLCompartible(obraId, capIdx = null) {
            let nuevaURL = `?obra=${obraId}`;
            if (capIdx !== null) {
                nuevaURL += `&cap=${capIdx + 1}`;
            }
            window.history.pushState({}, "", nuevaURL);
        }

        function procesarEnlacesCompartidos() {
            const params = new URLSearchParams(window.location.search);
            const obraId = params.get('obra');
            const capParam = params.get('cap');

            if (obraId) {
                const obraExiste = CATALOGO_NOVELAS.find(o => o.id === obraId);
                if (obraExiste) {
                    verFichaObra(obraId);
                    if (capParam) {
                        const capIdx = parseInt(capParam) - 1;
                        if (capIdx >= 0 && capIdx < obraExiste.capitulos.length) {
                            cargarLecturaCapitulo(capIdx);
                        }
                    }
                }
            } else {
                renderizarListaObras();
            }
        }
                const verFichaObraOriginal = verFichaObra;
        verFichaObra = function(id) {
            verFichaObraOriginal(id);
            actualizarURLCompartible(id);
        };

        const cargarLecturaCapituloOriginal = cargarLecturaCapitulo;
        cargarLecturaCapitulo = function(index) {
            cargarLecturaCapituloOriginal(index);
            if (novelaActiva) {
                actualizarURLCompartible(novelaActiva.id, index);
            }
        };

        window.onload = () => { 
            procesarEnlacesCompartidos(); 
        };
    </script>
</body>
</html>
